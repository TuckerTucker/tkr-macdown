name: CI

# Replaces the decommissioned Travis CI pipeline (.travis.yml).
on:
  push:
  pull_request:

# The job only reads the repository; nothing it runs needs a write scope.
permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-14
    # Recent runs finish in 2-3 minutes with a warm Pods cache. The bound
    # leaves room for a cold cache and stops a hung test from holding the
    # runner for the 6-hour default.
    timeout-minutes: 20

    env:
      WORKSPACE: MacDown.xcworkspace
      SCHEME: MacDown

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      # Ruby from .ruby-version, CocoaPods and its gems from Gemfile.lock.
      - name: Set up Ruby and the pinned CocoaPods
        uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        run: bundle exec pod --version && bundle exec pod install

      - name: Build peg-markdown-highlight dependency
        run: make -C Dependency/peg-markdown-highlight

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean test
