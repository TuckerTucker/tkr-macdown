name: CI

# Replaces the decommissioned Travis CI pipeline (.travis.yml).
on:
  push:
  pull_request:

jobs:
  release-tooling:
    name: Release tooling tests
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install -r Tools/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s Tools/tests -v

      - name: CLI is headless
        run: python Tools/build_for_release.py --help

  test:
    name: Build & Test
    runs-on: macos-14

    env:
      WORKSPACE: MacDown.xcworkspace
      SCHEME: MacDown

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # The runner image ships CocoaPods; the Gemfile is for local use.
      - name: Install Pods
        run: pod --version && pod install

      - name: Build peg-markdown-highlight dependency
        run: make -C Dependency/peg-markdown-highlight

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean test
